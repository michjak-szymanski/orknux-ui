name: CI

# Every push and every pull request is typechecked and built. Only main and
# release tags are published: an image for a branch nobody has reviewed is a
# liability rather than a convenience.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE_NAME: orknux-ui

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # Docker Hub takes 25,000 bytes of description and not one more. The
      # action that publishes it truncates silently past that and only warns,
      # which would leave the reference ending mid-sentence with the last two
      # sections gone - and nothing red anywhere to say so. Checked here rather
      # than at publish time so it fails on the branch that grew the file,
      # while somebody is still editing it.
      - name: The Docker Hub description has to fit
        run: |
          limit=25000
          comfortable=24000
          size=$(wc -c < DOCKERHUB.md)
          echo "DOCKERHUB.md is $size bytes of $limit."
          if [ "$size" -gt "$limit" ]; then
            echo "::error file=DOCKERHUB.md::$size bytes, and Docker Hub takes $limit. Shorten it by $((size - limit)) bytes, or move a section into README.md and link to it - do not let it be truncated, because the end is where the least-known settings are."
            exit 1
          fi
          if [ "$size" -gt "$comfortable" ]; then
            echo "::warning file=DOCKERHUB.md::$size bytes, $((limit - size)) short of the $limit Docker Hub allows. Adding another variable or two will break the build - worth shortening now rather than in the middle of a release."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is what the container
      # the developers use installs from, so CI should install the same tree.
      - name: Install
        run: npm ci

      # `tsc -b` on its own, before the build, so a type error is reported as a
      # type error rather than as whatever vite says when it cannot compile.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    # The bundle has to compile before anything is published; the image build
    # runs the same build again, so a red typecheck cannot reach the registry.
    needs: build
    # Never from a pull request: a fork's pull request must not be able to reach
    # the registry credentials, and an unmerged change has nothing to publish.
    #
    # And not at all where the registry credentials have not been set: a fork,
    # or this repository before somebody adds them. Skipped is the honest
    # result there — a red run says the build is broken, and it is not.
    if: github.event_name == 'push' && vars.DOCKERHUB_USERNAME != ''

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same scheme the server publishes under: latest follows main, a
      # vX.Y.Z tag also publishes X.Y.Z and X.Y, and every build carries its
      # commit — the one tag that never moves.
      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # And the repository description, which until now was a file somebody
      # remembered to paste into a web form. DOCKERHUB.md claims to list every
      # environment variable this image reads; a claim that is true in git and
      # eleven variables out of date on Docker Hub is worse than no claim, and
      # an operator planning an upgrade reads the one on Docker Hub.
      #
      # Last, and after the push, so a description that fails to update cannot
      # stop the image being published - the images are the release, and this
      # is the page beside them. It goes red, which is the point.
      #
      # The token needs read, write *and* delete: updating a description is not
      # a push, and a token scoped only to push answers 401 here while working
      # perfectly in the step above.
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          # A token of its own, if there is one, because this is the only step
          # here that needs delete scope - see the note above - and the push
          # above should not be carrying it. Falls back to the token that
          # pushes, which then has to be the wider one.
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKERHUB.md

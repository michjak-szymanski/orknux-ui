# What every forwarded request carries. The server decides what a caller may
# see from the session it presents, and logs who did it, so the address it was
# asked from has to survive the hop.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The chat answers as it is written, over an event stream: buffering it would
# hold the whole answer back and deliver it in one piece at the end.
proxy_buffering off;
proxy_read_timeout 300s;

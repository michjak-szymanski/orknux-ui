# What every forwarded request carries. The server decides what a caller may
# see from the session it presents, and logs who did it, so the address it was
# asked from has to survive the hop.
proxy_http_version 1.1;
# $http_host and not $host, which is the same thing with the port removed.
# Dropping it makes the server rebuild its own address without the port, so a
# page served on any port but 80 has an Origin that no longer matches the
# address the request appears to have arrived at. Same-origin then reads as
# cross-origin, CORS is consulted for every ordinary call the page makes, and
# in the one-container image - which allows no origins, because it never
# expected to need any - every one of them is refused. The symptom is a
# working sign-in page whose every request comes back 403.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The chat answers as it is written, over an event stream: buffering it would
# hold the whole answer back and deliver it in one piece at the end.
proxy_buffering off;
proxy_read_timeout 300s;
